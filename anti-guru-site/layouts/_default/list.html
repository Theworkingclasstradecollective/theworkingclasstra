{{ define "main" }}
<section class="mx-auto max-w-6xl px-4 py-12 md:py-16">
  <h1 class="text-[clamp(2.4rem,7vw,4.8rem)]">{{ .Title }}</h1>
  <div class="prose-plain mt-6">{{ .Content }}</div>
  {{ with .Pages }}
  <ul class="mt-10 divide-y-2 divide-line border-y-2 border-ink">
    {{ range .ByWeight }}
    <li><a class="flex items-baseline justify-between gap-4 py-4 no-underline hover:text-accent" href="{{ .RelPermalink }}"><span class="font-display text-xl uppercase">{{ .Title }}</span><span class="font-mono text-xs uppercase tracking-widest text-muted">Open &rarr;</span></a></li>
    {{ end }}
  </ul>
  {{ end }}
</section>
{{ end }}
