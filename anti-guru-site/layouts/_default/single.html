{{ define "main" }}
<article class="mx-auto max-w-6xl px-4 py-12 md:py-20">
  <header class="max-w-4xl">
    {{ with .Params.kicker }}<p class="tag tag-brand">{{ . }}</p>{{ end }}
    <h1 class="mt-5 text-[clamp(2.6rem,8vw,5.6rem)]">{{ .Title }}</h1>
    {{ with .Params.lede }}<p class="mt-6 max-w-2xl border-l-8 border-brand pl-4 font-mono text-base leading-relaxed text-muted">{{ . }}</p>{{ end }}
  </header>
  <div class="prose-plain mt-12">
    {{ .Content }}
  </div>
</article>
{{ end }}
