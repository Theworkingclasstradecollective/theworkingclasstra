{{ define "main" }}
<section class="mx-auto max-w-6xl px-4 py-12 md:py-16">
  <p class="tag tag-brand">Catalog</p>
  <h1 class="mt-5 text-[clamp(2.4rem,7vw,4.8rem)]">{{ .Title }}</h1>
  <div class="prose-plain mt-6">{{ .Content }}</div>

  <div class="mt-12 grid gap-10 lg:grid-cols-2">
    {{ range .Pages.ByWeight }}
      {{ partial "book-card.html" . }}
    {{ end }}
  </div>

  <div class="mt-20">{{ partial "newsletter.html" . }}</div>
</section>
{{ end }}
